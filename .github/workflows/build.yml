name: Build KwarnuStatusBar  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout Source Code  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install Dependencies  
        run: |  
          brew install ldid dpkg  
  
      - name: Clone Theos  
        run: |  
          git clone --recursive https://github.com/theos/theos.git ~/theos  
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV  
  
      - name: Download iOS SDK  
        run: |  
          rm -rf $HOME/theos/sdks  
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks  
  
      - name: Enforce Valid Control File  
        run: |  
          cat << 'EOF' > control  
          Package: com.kwarnu.statusbar  
          Name: KwarnuStatusBar  
          Version: 1.0.0  
          Architecture: iphoneos-arm64  
          Description: Kwarnu StatusBar Tweak  
          Maintainer: kwarnu  
          Author: kwarnu  
          Section: Tweaks  
          Depends: mobilesubstrate  
          EOF  
          cat control  
  
      - name: Compile Package  
        run: |  
          export THEOS=$HOME/theos  
          make clean  
          make package FINALPACKAGE=1  
  
      - name: Organize Debian Packages  
        run: |  
          mkdir -p packages  
          find . -type f -name "*.deb" -exec cp -v {} packages/ \;  
          ls -la packages/  
  
      - name: Upload .deb Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: KwarnuStatusBar-Rootless  
          path: packages/*.deb  
          if-no-files-found: error  
